version: '3.8'

services:
  backend:
    build:
      context: ./backend 1
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend 1:/app
      - /app/venv # Prevents host OS venv from conflicting with container
    environment:
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend 1/.env

  frontend:
    build:
      context: ./frontend 1
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./frontend 1:/app
      - /app/node_modules # Prevents host OS node_modules from overwriting container's
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for file watching inside Docker
    env_file:
      - ./frontend 1/.env
    depends_on:
      - backend
